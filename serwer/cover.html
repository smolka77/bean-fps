<html lang="en">
<head>

<title>iykyk</title>

<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3.4vmin, 30px); padding: 0 16px 4vmin; color: #cfcfd6;
    font: 400 16px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; -webkit-tap-highlight-color: transparent; }

  /* tło: czerń z ledwo widocznym światłem za głową (żeby czarne uszy nie ginęły) */
  .glow { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 42% 50% at 50% 38%, rgba(96, 104, 140, 0.20), transparent 72%); animation: glowIn 2.6s ease-out both, glowPulse 6s 2.6s ease-in-out infinite; }
  .vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 44%, transparent 40%, rgba(0, 0, 0, 0.85) 100%); }
  .dust { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dust i { position: absolute; bottom: -10px; border-radius: 50%; background: rgba(200, 208, 230, 0.5); opacity: 0; animation: rise linear infinite; }

  .stage { position: relative; width: min(195px, 38vw, 25vh); aspect-ratio: 385 / 403; flex: none; animation: stageIn .45s ease-out both; }
  .track { position: absolute; inset: 0; transform: translate(calc(var(--hx, 0) * 1px), calc(var(--hy, 0) * 1px)) rotate(calc(var(--hr, 0) * 1deg)); transform-origin: 50% 92%; transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
  .cat { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; transform-origin: 50% 92%; }

  /* pole hasła: retro, 8-bitowa ramka z ucietymi rogami, piksel-font, twardy cien */
  form { position: relative; width: min(190px, 60vw); animation: formIn .45s ease-out both; }
  .field { --c: #f1ead8; position: relative; height: 34px; margin: 3px; background: #0b0b0d; image-rendering: pixelated;
    box-shadow: 0 -2px 0 0 var(--c), 0 2px 0 0 var(--c), -2px 0 0 0 var(--c), 2px 0 0 0 var(--c), 0 4px 0 0 rgba(241, 234, 216, 0.14), inset 0 -2px 0 0 rgba(255, 255, 255, 0.05); transition: none; }
  .field:focus-within { --c: #ffffff; }
  input { position: absolute; left: 0; top: 0; width: 200%; height: 68px; padding: 2px 68px 0; transform: scale(.5); transform-origin: 0 0; text-align: center; letter-spacing: 0.1em; color: #f1ead8; caret-color: #f1ead8; caret-shape: underscore; background: transparent;
    border: 0; border-radius: 0; outline: none; font: 400 16px/1 "Press Start 2P", ui-monospace, Consolas, monospace; }
  input::placeholder { color: #5a5a62; opacity: 1; letter-spacing: 0.18em; }
  input:focus::placeholder { color: #3e3e45; }
  .go { z-index: 2; position: absolute; right: 5px; top: 5px; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; color: #0b0b0d; background: #f1ead8; border: 0; border-radius: 0; cursor: pointer;
    box-shadow: 0 -2px 0 0 #f1ead8, 0 2px 0 0 #f1ead8, -2px 0 0 0 #f1ead8, 2px 0 0 0 #f1ead8, 0 3px 0 0 #8c8678; transform: translateY(0); }
    .go:hover { background: #fff; box-shadow: 0 -2px 0 0 #fff, 0 2px 0 0 #fff, -2px 0 0 0 #fff, 2px 0 0 0 #fff, 0 3px 0 0 #8c8678; }
  .go:active { transform: translateY(3px); box-shadow: 0 -2px 0 0 #f1ead8, 0 2px 0 0 #f1ead8, -2px 0 0 0 #f1ead8, 2px 0 0 0 #f1ead8; }
  .go svg { width: 10px; height: 11px; shape-rendering: crispEdges; }
  .field.shake { animation: shake .4s steps(1, end); }
  /* puste pole: prosta, migająca kreska na środku; po wpisaniu kreska idzie za tekstem */
  input:placeholder-shown { caret-color: transparent; }
  .field::after { content: ""; position: absolute; left: 50%; top: 21px; width: 10px; height: 3px; margin-left: -5px; background: #f1ead8; pointer-events: none; animation: dash 1s steps(1) infinite; display: none; }
  .field:has(input:placeholder-shown)::after { display: block; }
  @keyframes dash { 0% { opacity: 1 } 50% { opacity: 0 } }
  input:disabled { opacity: .5; }

  /* zły kod: kot cały się trzęsie i robi czerwony; dobry: rozbłysk, zgaśnięcie i wczytanie strony */
  body.open .stage { animation: leave 1.1s cubic-bezier(.5, 0, .9, .4) forwards; }
  body.open form { animation: formOut .5s ease-in forwards; }

  @keyframes glowIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes glowPulse { 0%, 100% { opacity: 1 } 50% { opacity: .7 } }
  @keyframes rise { 0% { transform: translate(0, 0); opacity: 0 } 12% { opacity: .55 } 100% { transform: translate(var(--dx, 20px), -105vh); opacity: 0 } }
  @keyframes stageIn { 0% { opacity: 0; transform: translateY(16px) scale(.97); filter: blur(6px) } 100% { opacity: 1; transform: none; filter: none } }
  @keyframes formIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @keyframes formOut { to { opacity: 0; transform: translateY(8px) } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.2deg) } 50% { transform: translateY(-6px) rotate(1.2deg) } }
  @keyframes shake { 0%, 100% { transform: translateX(0) } 14% { transform: translateX(-3px) } 28% { transform: translateX(3px) } 42% { transform: translateX(-3px) } 57% { transform: translateX(3px) } 71% { transform: translateX(-2px) } 85% { transform: translateX(2px) } }
  @keyframes blinkIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes leave { 0% { opacity: 1; filter: none; transform: none } 40% { filter: brightness(1.6); opacity: 1; transform: scale(1.05) } 100% { opacity: 0; filter: brightness(2.6); transform: scale(1.18) } }

  /* podpis w prawym dolnym rogu: link do Instagrama autora, mała czcionka, przygaszony */
  .credit { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 5; padding: 8px 6px; font: 400 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: .02em; color: rgba(222, 222, 230, 0.74); text-decoration: none; animation: formIn .45s ease-out both; transition: color .2s; }
  .credit:hover, .credit:focus-visible { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  .credit:focus-visible { outline: 1px solid rgba(236, 236, 244, 0.5); outline-offset: 2px; }
  body.open .credit { opacity: 0 !important; transition: opacity .3s; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
    .dust { display: none; }
  }
</style>
